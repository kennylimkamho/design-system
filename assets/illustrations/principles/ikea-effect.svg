<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- IKEA Effect: three discrete parts that snap together into a whole -->
  <g transform="translate(32 60)">
    <rect x="0"  y="0" width="40" height="40" rx="4" />
  </g>
  <g transform="translate(100 60)">
    <rect x="0"  y="0" width="40" height="40" rx="4" />
  </g>
  <g transform="translate(168 60)">
    <rect x="0"  y="0" width="40" height="40" rx="4" />
  </g>
  <!-- arrow to assembled form -->
  <path d="M120 30 l0 14" stroke-dasharray="3 3" />
  <path d="M116 40 l4 4 l4 -4" />
  <!-- assembled result -->
  <rect x="60" y="116" width="120" height="28" rx="4" fill="currentColor" fill-opacity="0.15" />
  <line x1="100" y1="116" x2="100" y2="144" />
  <line x1="140" y1="116" x2="140" y2="144" />
</svg>