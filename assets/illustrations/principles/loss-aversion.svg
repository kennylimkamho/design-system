<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Loss Aversion: scale tipped toward loss -->
  <line x1="120" y1="30" x2="120" y2="130" />
  <line x1="60"  y1="50" x2="180" y2="80" />
  <!-- loss pan (heavier, lower) -->
  <line x1="50"  y1="46" x2="80"  y2="42" />
  <path d="M50 46 l30 -4 l0 8 l-30 4 z" />
  <!-- gain pan (lighter, higher) -->
  <line x1="160" y1="84" x2="200" y2="80" />
  <path d="M160 84 l40 -4 l0 8 l-40 4 z" />
  <!-- annotations -->
  <text x="32"  y="68" font-family="ui-monospace, monospace" font-size="9" fill="currentColor" stroke="none">LOSS</text>
  <text x="208" y="78" font-family="ui-monospace, monospace" font-size="9" fill="currentColor" stroke="none" text-anchor="end">GAIN</text>
  <!-- exclamation on loss side -->
  <circle cx="64" cy="22" r="8" />
  <line x1="64" y1="18" x2="64" y2="24" stroke-width="2" />
  <circle cx="64" cy="28" r="0.5" fill="currentColor" />
</svg>