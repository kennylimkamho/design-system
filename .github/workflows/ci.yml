name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Copy linter (no proprietary names)
        run: |
          if grep -rE "BobChat|ChatDaddy|cobalt|Blauer" apps/ packages/ content/ 2>/dev/null; then
            echo "::error::Proprietary name leaked into shipped code/content"
            exit 1
          fi